[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raev-guard"
version = "1.0.0"
description = "Analizador defensivo de registros de autenticación"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rafael GG"}]

[project.scripts]
raev-guard = "raev_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

