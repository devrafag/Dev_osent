services:
  - type: web
    name: raev-guard
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: raev-guard-dashboard --host 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: RAEV_USERNAME
        sync: false
      - key: RAEV_PASSWORD_HASH
        sync: false
      - key: RAEV_SESSION_SECRET
        generateValue: true
      - key: RAEV_COOKIE_SECURE
        value: "1"

